<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merry Christmas</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: "Comic Sans MS", "Microsoft YaHei", cursive, sans-serif;
    }
    canvas { display: block; }
    .text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: clamp(28px, 8vw, 56px);
      text-align: center;
      text-shadow: 0 0 12px rgba(255,255,255,.9), 0 0 30px #e55;
      pointer-events: none;
      z-index: 10;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="text">Merry Christmas</div>
  <canvas id="treeCanvas"></canvas>
  <script>
    const canvas = document.getElementById('treeCanvas');
    const ctx = canvas.getContext('2d');

    let snowflakes = [];
    let treeParticles = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      snowflakes = [];
      for (let i = 0; i < 300; i++) {
        snowflakes.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 3 + 1,
          speed: Math.random() * 2 + 0.5,
          opacity: Math.random() * 0.8 + 0.2
        });
      }

      treeParticles = [];
      const treeHeight = canvas.height * 0.8;
      const treeWidth = canvas.width * 0.6;
      const centerX = canvas.width / 2;
      const centerY = canvas.height * 0.7;

      for (let i = 0; i < 2000; i++) {
        const y = Math.random() * treeHeight;
        const ratio = y / treeHeight;
        const radius = (1 - ratio) * treeWidth / 2;
        const angle = Math.random() * Math.PI * 2;
        treeParticles.push({
          x: centerX + Math.cos(angle) * radius,
          y: centerY - y,
          z: Math.sin(angle) * radius,
          size: Math.random() * 2 + 1,
          color: `hsl(${340 + Math.random() * 20}, 100%, ${60 + Math.random() * 20}%)`,
          speed: Math.random() * 0.02 + 0.005
        });
      }
    }

    function drawSnow() {
      snowflakes.forEach(snow => {
        ctx.globalAlpha = snow.opacity;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(snow.x, snow.y, snow.size, 0, Math.PI * 2);
        ctx.fill();
        snow.y += snow.speed;
        snow.x += Math.sin(snow.y * 0.01) * 0.5;
        if (snow.y > canvas.height) {
          snow.y = -snow.size;
          snow.x = Math.random() * canvas.width;
        }
      });
      ctx.globalAlpha = 1;
    }

    function drawTree() {
      treeParticles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        p.x += Math.sin(p.y * 0.01 + Date.now() * p.speed) * 0.5;
      });
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawSnow();
      drawTree();
      requestAnimationFrame(animate);
    }

    resize();
    animate();
    window.addEventListener('resize', resize);
  </script>
</body>
</html>
